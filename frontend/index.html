<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'><rect x='1' y='1' width='8' height='8' rx='2' fill='%237a8296' opacity='0.45'/><rect x='11' y='1' width='8' height='8' rx='2' fill='%237a8296' opacity='0.7'/><rect x='1' y='11' width='8' height='8' rx='2' fill='%237a8296'/><rect x='11' y='11' width='8' height='8' rx='2' fill='%230066FF'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0d14" />
    <title>Daily Commit · DSA practice planner and problem tracker</title>
    <meta name="description" content="Plan the day's DSA problems, log every solve, revise on a 3, 7 and 21 day schedule, and keep your streak while you prepare for coding interviews." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..600&family=Geist+Mono:wght@400..500&display=swap" rel="stylesheet">
    <script>
      // Apply the saved theme before first paint so the splash matches it.
      try {
        var t = localStorage.getItem('theme');
        if (!t) t = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.classList.remove('dark', 'light');
        document.documentElement.classList.add(t);
      } catch (e) {}
      // Cinematic intro: once per tab session, never for reduced motion or data saver.
      try {
        var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        var saveData = navigator.connection && navigator.connection.saveData;
        if (/[?&]introAt=/.test(location.search)) document.documentElement.classList.add('sp-intro');
        else if (!reduce && !saveData && !sessionStorage.getItem('dc-intro')) {
          sessionStorage.setItem('dc-intro', '1');
          document.documentElement.classList.add('sp-intro');
        }
      } catch (e) {}
    </script>
    <style>
      #splash {
        --sp-bg: #0b0d14; --sp-cell: #eef0f5; --sp-text: #eef0f5; --sp-muted: #7a8296; --sp-track: rgba(238,240,245,.08);
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
        background: var(--sp-bg); color: var(--sp-text);
        font-family: 'Geist', system-ui, sans-serif;
        transition: opacity .45s cubic-bezier(.22,1,.36,1), visibility .45s, background-color .6s cubic-bezier(.22,1,.36,1);
      }
      /* Intro (public/intro/intro.js): canvas heatmap + real-text lockup, full screen, sharp at any resolution. */
      #splash .ic { position: absolute; inset: 0; overflow: hidden; opacity: 0; pointer-events: none; transition: opacity .6s cubic-bezier(.22,1,.36,1); }
      html.sp-intro #splash .ic { opacity: 1; }
      #intro-canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
      #splash .ic-vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.4) 100%); }
      html.light #splash .ic-vignette { background: radial-gradient(ellipse at center, transparent 55%, rgba(17,24,39,.07) 100%); }
      #splash .ic-grain { position: absolute; inset: -64px; opacity: .045; animation: ic-grain .4s steps(1) infinite; }
      html.light #splash .ic-grain { opacity: .035; }
      @keyframes ic-grain { 0% { transform: translate(0, 0); } 25% { transform: translate(-37px, 21px); } 50% { transform: translate(18px, -45px); } 75% { transform: translate(-52px, -11px); } }
      #intro-lockup { --fs: clamp(28px, 3.1vw, 64px); position: absolute; left: 50%; top: 50%; width: max-content; display: flex; flex-direction: column; align-items: center; transform: translate(-50%, -50%); transition: opacity .6s cubic-bezier(.22,1,.36,1), transform .6s cubic-bezier(.22,1,.36,1); }
      #intro-lockup.out { opacity: 0; transform: translate(-50%, -50%) scale(.98); }
      #splash .ic-row { display: flex; align-items: center; column-gap: calc(var(--fs) * .42); transform: translateX(var(--shift, 0px)); transition: transform 1s cubic-bezier(.16,1,.3,1); }
      #intro-lockup.reveal .ic-row { transform: none; }
      #splash .ic-logo { display: grid; grid-template-columns: repeat(2, calc(var(--fs) * .62)); gap: calc(var(--fs) * .12); }
      #splash .ic-logo span { width: calc(var(--fs) * .62); height: calc(var(--fs) * .62); border-radius: calc(var(--fs) * .16); background: rgb(158,165,178); opacity: 0; }
      html.light #splash .ic-logo span { background: rgb(122,130,150); }
      #splash .ic-logo span.on:nth-child(1) { opacity: .45; }
      #splash .ic-logo span.on:nth-child(2) { opacity: .7; }
      #splash .ic-logo span.on:nth-child(3) { opacity: 1; }
      #splash .ic-logo span:nth-child(4), html.light #splash .ic-logo span:nth-child(4) { background: #0066ff; }
      #splash .ic-logo span.on:nth-child(4) { opacity: 1; animation: ic-pop .6s cubic-bezier(.22,1,.36,1) both, ic-glow 1.4s ease-out forwards; }
      @keyframes ic-pop { 0% { transform: scale(.7); } 55% { transform: scale(1.08); } 100% { transform: scale(1); } }
      @keyframes ic-glow { 0% { box-shadow: 0 0 0 0 rgba(0,102,255,0); } 30% { box-shadow: 0 0 calc(var(--fs) * .9) calc(var(--fs) * .08) rgba(0,102,255,.5); } 100% { box-shadow: 0 0 calc(var(--fs) * .5) 0 rgba(0,102,255,.2); } }
      #splash .ic-name { font-size: var(--fs); line-height: 1; font-weight: 500; white-space: nowrap; color: #eef0f5; letter-spacing: .08em; opacity: 0; clip-path: inset(0 100% 0 0); transition: clip-path 1s cubic-bezier(.16,1,.3,1), letter-spacing 1.2s cubic-bezier(.16,1,.3,1), opacity .4s; }
      #intro-lockup.reveal .ic-name { opacity: 1; letter-spacing: -.02em; clip-path: inset(0 -10% 0 0); }
      #splash .ic-tag { margin-top: calc(var(--fs) * .5); font-size: max(13px, calc(var(--fs) * .3)); color: #7a8296; opacity: 0; transform: translateY(6px); transition: opacity .7s cubic-bezier(.22,1,.36,1) .6s, transform .7s cubic-bezier(.22,1,.36,1) .6s; }
      #intro-lockup.reveal .ic-tag { opacity: 1; transform: none; }
      html.light #splash .ic-name { color: #111827; }
      html.light #splash .ic-tag { color: #6b7487; }
      #splash .sp-logo, #splash .sp-name, #splash .sp-bar, #splash .sp-status, #splash .sp-skip { transition: opacity .6s cubic-bezier(.22,1,.36,1); }
      #splash .sp-intro-skip { position: absolute; right: 24px; bottom: 24px; display: none; padding: 6px 12px; border: 0; border-radius: 8px; background: transparent; color: #7a8296; font: inherit; font-size: 13px; cursor: pointer; transition: color .2s; }
      #splash .sp-intro-skip:hover { color: #eef0f5; }
      #splash .sp-intro-skip:focus-visible, #splash .sp-skip:focus-visible { outline: 2px solid #0066ff; outline-offset: 2px; }
      html.light #splash .sp-intro-skip { color: #6b7487; }
      html.light #splash .sp-intro-skip:hover { color: #111827; }
      #splash .sp-sound { right: auto; left: 24px; }
      html.sp-intro #splash .sp-intro-skip { display: block; }
      html.sp-intro #splash .sp-intro-skip[hidden] { display: none; }
      html.sp-intro #splash .sp-logo, html.sp-intro #splash .sp-name, html.sp-intro #splash .sp-bar, html.sp-intro #splash .sp-status, html.sp-intro #splash .sp-skip { opacity: 0; pointer-events: none; }
      html.light #splash { --sp-bg: #f5f7fa; --sp-cell: #111827; --sp-text: #111827; --sp-muted: #6b7487; --sp-track: rgba(17,24,39,.08); }
      #splash.splash-hide { opacity: 0; visibility: hidden; }
      #splash .sp-logo { display: grid; grid-template-columns: repeat(2, 22px); gap: 6px; }
      #splash .sp-logo span { width: 22px; height: 22px; border-radius: 6px; background: var(--sp-cell); opacity: .15; animation: sp-cell 1.6s cubic-bezier(.22,1,.36,1) infinite; }
      #splash .sp-logo span:nth-child(1) { animation-delay: 0s; }
      #splash .sp-logo span:nth-child(2) { animation-delay: .2s; }
      #splash .sp-logo span:nth-child(4) { animation-delay: .4s; }
      #splash .sp-logo span:nth-child(3) { animation-delay: .6s; }
      #splash .sp-name { font-size: 18px; font-weight: 500; letter-spacing: -.01em; }
      #splash .sp-bar { width: 120px; height: 2px; border-radius: 2px; background: var(--sp-track); overflow: hidden; }
      #splash .sp-bar::after { content: ''; display: block; width: 40%; height: 100%; border-radius: 2px; background: #0066ff; animation: sp-bar 1.1s ease-in-out infinite; }
      #splash .sp-status { margin: 0; min-height: 18px; max-width: 280px; padding: 0 16px; text-align: center; font-size: 13px; line-height: 18px; color: var(--sp-muted); }
      #splash .sp-skip { margin-top: -8px; padding: 6px 12px; border: 1px solid var(--sp-track); border-radius: 8px; background: transparent; color: var(--sp-muted); font: inherit; font-size: 12px; cursor: pointer; transition: color .2s, border-color .2s; }
      #splash .sp-skip:hover { color: var(--sp-text); border-color: var(--sp-muted); }
      #splash .sp-skip[hidden] { display: none; }
      @keyframes sp-cell { 0%, 100% { opacity: .15; transform: scale(.92); } 35% { opacity: 1; transform: scale(1); background: #0066ff; } 60% { opacity: .55; } }
      @keyframes sp-bar { 0% { transform: translateX(-100%); } 100% { transform: translateX(260%); } }
      @media (prefers-reduced-motion: reduce) {
        #splash .sp-logo span { animation: none; opacity: .45; }
        #splash .sp-logo span:nth-child(4) { opacity: 1; background: #0066ff; }
        #splash .sp-bar::after { animation-duration: 2.4s; }
      }
    </style>
  </head>
  <body class="font-sans antialiased min-h-screen">
    <div id="splash" role="status" aria-live="polite" aria-label="Loading Daily Commit">
      <div class="ic" aria-hidden="true">
        <canvas id="intro-canvas"></canvas>
        <div id="intro-lockup">
          <div class="ic-row">
            <div class="ic-logo"><span></span><span></span><span></span><span></span></div>
            <div class="ic-name">Daily Commit</div>
          </div>
          <div class="ic-tag">One problem a day. Every day.</div>
        </div>
        <div class="ic-vignette"></div>
        <div id="intro-grain" class="ic-grain"></div>
      </div>
      <button id="splash-sound" class="sp-intro-skip sp-sound" type="button" hidden>Sound on</button>
      <button id="splash-intro-skip" class="sp-intro-skip" type="button">Skip intro</button>
      <div class="sp-logo" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
      <div class="sp-name">Daily Commit</div>
      <div class="sp-bar" aria-hidden="true"></div>
      <p id="splash-status" class="sp-status">Starting up</p>
      <button id="splash-skip" class="sp-skip" type="button" hidden>Continue offline</button>
    </div>
    <script src="/intro/intro.js"></script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
