name: CI

# Runs on every push to main and every pull request: the backend tests and a frontend build.
# The backend tests start the real server (testing mode, and production mode on an in-memory
# Postgres), so they need no database, keys or network.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # the test runner's glob patterns need Node 21 or newer
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install
        working-directory: backend
        run: npm ci
      - name: Test
        working-directory: backend
        run: npm test

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      # The runner tests compile and run real solutions; ubuntu-latest has python3, g++ and java
      - name: Test
        working-directory: frontend
        run: npm test
      - name: Build
        working-directory: frontend
        run: npx vite build --outDir "$RUNNER_TEMP/dist" --emptyOutDir
